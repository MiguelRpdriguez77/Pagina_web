<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_contactanos.css">
    <title>NexCar - Contactanos</title>
</head>
<body>
    <header>
        <h1>NexCar</h1>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="catalogo.html">Catalogo</a></li>
            <li><a href="contactanos.html">Contactanos</a></li>
        </ul>
    </header>
    
    <main>
        <h2>Contáctanos</h2>
        <p>Déjanos tus datos y te responderemos pronto.</p>
        
        <form>
            <label>Nombre:</label>
            <input type="text" placeholder="Tu nombre">
            
            <label>Email:</label>
            <input type="email" placeholder="tu@correo.com">
            
            <label>Teléfono:</label>
            <input type="text" placeholder="Tu número">
            
            <label>Mensaje:</label>
            <textarea placeholder="¿En qué te podemos ayudar?"></textarea>
            
            <button type="submit">Enviar Mensaje</button>
        </form>
        
        <div class="info-empresa">
            <h3>Nuestros datos</h3>
            <ul>
                <li>📍 Dirección: Av. Principal 123</li>
                <li>📞 Teléfono: 555-1234</li>
                <li>✉️ Email: info@nexcar.com</li>
            </ul>
        </div>
    </main>
    <footer>
        <div class="footer-contenido">
            <p><strong> © 2026 NexCar. Todos los derechos reservados. </strong></p>
        </div>
    </footer>
</body>
</html>
